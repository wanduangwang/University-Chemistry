# MyST GitHub Pages Deploy (main branch).
# Builds the MyST site and deploys it to GitHub Pages on push to `main`.
# REQUIRED repo setting: Settings → Pages → Build and deployment → Source = "GitHub Actions".

name: MyST GitHub Pages Deploy
on:
  push:
    branches: [main]
env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install MyST
        run: npm install -g mystmd
      - name: Fix base_url for GitHub Pages
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: 'sed -i "s|base_url: /|base_url: /${REPO_NAME}/|" myst.yml'
      - name: Build HTML Assets
        run: myst build --html
      - name: Upload artifact
        uses: upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: deploy-pages@v4
